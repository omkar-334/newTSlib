program: run.py
project: cndiff-classification
name: Heartbeat Sweep
method: bayes  # or "grid", "random"
metric:
  name: accuracy
  goal: maximize
parameters:
  task_name:
    value: classification
  is_training:
    value: 1
  model:
    value: CnDiff
  data:
    value: UEA
  gpu:
    value: 1
  model_id:
    values: ["Heartbeat"]  # You can include other dataset names for a sweep
  root_path:
    values: ["./dataset/Heartbeat/"]
  learning_rate:
    values: [0.0001, 0.0005, 0.001, 0.005, 0.01, 0.0002, 0.002, 0.02]
  n_heads:
    values: [4, 8, 16, 32]
  mlp_ratio:
    values: [1, 2, 3, 4]
  n_depth:
    values: [1, 2, 3, 4]
  n_emb:
    values: [2,4,6,8]
  use_cond:
    values: [True, False]
  use_tphi:
    values: [True, False]
  use_cls_token:
    values: [True, False]
  attn_dropout:
    values: [0.1, 0.2, 0.3, 0.4]


  batch_size:
    value: 16
  train_epochs:
    value: 100
  des:
    value: run
  wandb:
    value: True
  sweep:
    value: True
  
