program: run.py
project: uwave-classify
name: Uwave Sweep
method: bayes  # or "grid", "random"
metric:
  name: accuracy
  goal: maximize
parameters:
  task_name:
    value: classification
  is_training:
    value: 1
  model:
    value: CnDiff
  data:
    value: UEA
  gpu:
    value: 1
  model_id:
    values: ["UWaveGestureLibrary"]  # You can include other dataset names for a sweep
  root_path:
    values: ["./dataset/UWaveGestureLibrary/"]
  learning_rate:
    values: [0.0001, 0.001, 0.01]
  n_heads:
    values: [4, 8, 16]
  mlp_ratio:
    values: [1, 2, 3, 4]
  n_depth:
    values: [1, 2, 3, 4]
  n_emb:
    values: [2,4,6,8]
  use_cond:
    values: [True, False]
  use_tphi:
    values: [True, False]
  attn_dropout:
    values: [0.0, 0.1, 0.2, 0.3]


  batch_size:
    value: 16
  train_epochs:
    value: 100
  des:
    value: run
  wandb:
    value: True
  sweep:
    value: True
  
